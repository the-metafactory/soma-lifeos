# Install: arc install https://github.com/the-metafactory/soma-lifeos
schema: arc/v1
name: soma-lifeos
version: 0.1.0
type: library
tier: custom
description: Skills from Daniel Miessler's PAI / LifeOS, ported to run on top of Soma.
license: MIT
author:
  name: The MetaFactory
  github: the-metafactory
artifacts:
  - path: skills/bitter-lesson-engineering
    description: Audit an explicitly supplied instruction file with a CUT or KEEP verdict and reason for every rule.
  - path: skills/broadcast
    description: "Preview LinkedIn and Mastodon posts; --post requires a terminal and yes per channel."
  - path: skills/apify
    description: "Scrape social media, business data, ecommerce, and websites with Apify actor wrappers."
  - path: skills/bright-data
    description: Scrape URLs and crawl sites with progressive escalation to Bright Data.
  - path: skills/scraping
    description: Route web scraping to Bright Data workflows and Apify platform actors.
  - path: skills/browser
    description: "Automate headless browsing, screenshots, stories, and data extraction with agent-browser."
  - path: skills/interceptor
    description: "Automate real Chrome sessions and record, replay, and verify browser workflows."
  - path: skills/webdesign
    description: "Create, refine, export, integrate, and verify web interfaces through Claude Design."
  - path: skills/security-updates
    description: Collect ranked security news, research and breach reports with persistent deduplication.
  - path: skills/speaking
    description: Find open calls for papers by topic and region and draft speaking proposals.
  - path: skills/annual-reports
    description: List, refresh and compare vendor security annual reports with cited evidence.
  - path: skills/unify
    description: Check harmony across Soma skills, policy and purpose or explicitly selected paths.
  - path: skills/research
    description: Research topics at selectable depths and extract cited knowledge from web and media sources.
  - path: skills/extract-wisdom
    description: Extract structured wisdom and actionable insights from articles, videos, podcasts, and interviews.
  - path: skills/content-analysis
    description: Route content analysis and wisdom extraction for articles, videos, and podcasts.
  - path: skills/story-explanation
    description: Explain complex topics through narrative summaries in several lengths and formats.
  - path: skills/write-story
    description: Develop fiction through interviews, story bibles, exploration, chapter writing, and revision.
  - path: skills/interview
    description: Conduct phased interviews to review and fill personal context, preferences, and goals.
  - path: skills/private-investigator
    description: Find and verify people ethically through public records, social media, and reverse lookups.
  - path: skills/osint
    description: Research people, companies, domains, and threat actors through public sources.
  - path: skills/us-metrics
    description: Fetch and analyze US economic and social indicators from public data sources.
