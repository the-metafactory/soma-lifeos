# Install: arc install https://github.com/the-metafactory/soma-lifeos
schema: arc/v1
name: soma-lifeos
version: 0.1.0
type: library
tier: custom
description: Skills from Daniel Miessler's PAI / LifeOS, ported to run on top of Soma.
license: MIT
author:
  name: The MetaFactory
  github: the-metafactory
artifacts:
  - path: skills/apify
    description: "Scrape social media, business data, ecommerce, and websites with Apify actor wrappers."
  - path: skills/bright-data
    description: Scrape URLs and crawl sites with progressive escalation to Bright Data.
  - path: skills/scraping
    description: Route web scraping to Bright Data workflows and Apify platform actors.
  - path: skills/browser
    description: "Automate headless browsing, screenshots, stories, and data extraction with agent-browser."
  - path: skills/interceptor
    description: "Automate real Chrome sessions and record, replay, and verify browser workflows."
  - path: skills/webdesign
    description: "Create, refine, export, integrate, and verify web interfaces through Claude Design."
  - path: skills/telos
    description: "Analyze personal goals and project context, and create reports and dashboards."
  - path: skills/knowledge
    description: "Manage and search a typed knowledge archive with linked notes and provenance."
  - path: skills/migrate
    description: "Classify and import external content into the PAI taxonomy with provenance."
  - path: skills/sales
    description: "Turn product documentation into sales narratives, visuals, and talking points."
  - path: skills/security
    description: "Route reconnaissance, web assessments, prompt injection testing, and security intelligence."
  - path: skills/utilities
    description: "Route document processing, parsing, audio editing, Fabric patterns, and developer tools."
