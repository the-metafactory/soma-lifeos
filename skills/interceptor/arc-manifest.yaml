schema: arc/v1
name: interceptor
version: 0.1.0
type: skill
tier: custom
description: "Automate real Chrome sessions and record, replay, and verify browser workflows."
license: MIT
author:
  name: The MetaFactory
  github: the-metafactory
upstream:
  repo: danielmiessler/PAI
  path: Packs/Interceptor/src
  commit: 2fde1bbe9e8f280cd4998e244b53e3c66f3dc8b9
capabilities:
  filesystem:
    read:
      - ~/.soma/memory/SKILLS/interceptor/execution.jsonl
      - ~/.soma/memory/SKILLS/interceptor/execution-*.jsonl
      - ./**
      - /tmp/**
      - ~/Projects/interceptor/**
      - ~/Library/Application Support/*/NativeMessagingHosts/**
      - ~/Library/LaunchAgents/com.interceptor.bridge.plist
    write:
      - ./**
      - /tmp/**
      - ~/.soma/memory/SKILLS/interceptor/execution.jsonl
      - ~/.soma/memory/SKILLS/interceptor/execution-*.jsonl
      - ~/Projects/interceptor/**
      - ~/Library/Application Support/*/NativeMessagingHosts/**
      - ~/Library/LaunchAgents/com.interceptor.bridge.plist
      - /opt/homebrew/bin/interceptor*
      - /usr/local/bin/interceptor-bridge
  # Fixed service hosts; browsing and scraping also contact user-selected target hosts.
  network:
    - host: github.com
      reason: Fetch Interceptor source and updates.
    - host: localhost
      reason: Verify local applications and reproduce browser issues.
  bash:
    allowed: true
  secrets:
    []
