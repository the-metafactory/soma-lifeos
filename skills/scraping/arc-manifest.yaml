schema: arc/v1
name: scraping
version: 0.1.0
type: skill
tier: custom
description: Route web scraping to Bright Data workflows and Apify platform actors.
license: MIT
author:
  name: The MetaFactory
  github: the-metafactory
upstream:
  repo: danielmiessler/PAI
  path: Packs/Scraping/src
  commit: 2fde1bbe9e8f280cd4998e244b53e3c66f3dc8b9
capabilities:
  filesystem:
    read:
      - ~/.soma/skills/apify/**
      - ~/.soma/skills/bright-data/**
      - ./**
      - /tmp/**
    write:
      - ./**
      - /tmp/**
  # Fixed service hosts; browsing and scraping also contact user-selected target hosts.
  network:
    - host: api.apify.com
      reason: Run scraping actors and retrieve their datasets.
    - host: api.brightdata.com
      reason: Use Bright Data scraping and crawling services.
  bash:
    allowed: true
  secrets:
    - APIFY_TOKEN
    - APIFY_API_KEY
    - BRIGHT_DATA_API_KEY
    - BRIGHTDATA_API_KEY
